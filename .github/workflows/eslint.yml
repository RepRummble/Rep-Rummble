name: ESLint (Security SARIF)

# Uploads ESLint results to GitHub Security tab (Code scanning alerts).
# The ci-cd.yml lint job already gates the build — this is for visibility in
# the Security tab only, so continue-on-error is intentional.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '34 3 * * 6'  # weekly Saturday

jobs:
  eslint:
    name: ESLint SARIF upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - name: Install SARIF formatter
        working-directory: web
        run: npm install --no-save @microsoft/eslint-formatter-sarif

      - name: Run ESLint (SARIF output)
        working-directory: web
        run: >
          npx eslint src
          --format @microsoft/eslint-formatter-sarif
          --output-file ../eslint-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
