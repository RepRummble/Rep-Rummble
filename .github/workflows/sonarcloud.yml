name: SonarCloud analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for blame + new-code detection

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=makamdilip
            -Dsonar.projectKey=makamdilip_Rep-Rummble
            -Dsonar.sources=web/src,server/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/e2e/**
            -Dsonar.javascript.lcov.reportPaths=web/coverage/lcov.info
